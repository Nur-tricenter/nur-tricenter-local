# The compose project name. Docker Desktop groups every container under this label, and it
# is the first thing visible in the UI — so it names the platform, not a single component.
name: nur-tricenter

# =============================================================================
#  Nur-Tricenter platform: shared infra + every microservice process that runs on it.
#
#  Three files compose this stack, all through `include:` — never a copy:
#
#    docker-compose.infra.yml          Postgres + RabbitMQ + Consul (the platform)
#    ../../ms2-plans-and-recipes-catalog/catalog.compose.yml   the catalog's 2 processes
#    ../../nur-tricenter-identity/identity.compose.yml          identity's 2 processes
#
#  Plus the gateway, declared inline below, because it belongs to the platform
#  rather than to any one microservice:
#
#    gateway             ApiGateway.App    net10.0  (platform, fronts every service)
#
#  ---------------------------------------------------------------------------
#  WHY INCLUDE AND NOT COPY
#  ---------------------------------------------------------------------------
#  The catalog's services used to live HERE, pasted into this file, while the catalog
#  repository also had its own compose for running alone. That worked, and it was a
#  trap: two places to change one service. Editing the catalog's variables left this
#  file silently stale, and nothing failed — the platform just kept running the old
#  configuration.
#
#  `include:` removes the second copy. Each microservice owns its platform-variant
#  compose file, and this file names where to find them. A change lands in one place.
#
#  Each microservice repository ALSO has a standalone compose (docker-compose.yml in
#  the catalog, the same in identity) with its own Postgres and its own network, for
#  running that service alone. Those files are NOT included here.
#
#  Naming convention
#  -----------------
#    Every platform container is nur-tricenter-<what-it-is>: the prefix says the
#    platform, the suffix says the role. A container outlives the repository it was
#    built from, and a 60-character name costs more than it explains.
#
#      nur-tricenter-postgres           platform, shared
#      nur-tricenter-rabbitmq           platform, shared
#      nur-tricenter-consul             platform, shared
#      nur-tricenter-catalog-api        one microservice, its HTTP entry
#      nur-tricenter-catalog-workerservice   the same microservice, its worker
#      nur-tricenter-identity-api       one microservice, its HTTP entry
#      nur-tricenter-identity-workerservice  the same microservice, its worker
#      nur-tricenter-gateway            platform, the single public entry point
#
#    The compose SERVICE name and the container name are the same word.
#    They used to differ (apigateway-webapp vs the container), and that is what makes
#    `docker compose ps` disagree with `docker ps` and forces a lookup to work out
#    which is which. One name, both places.
#
#    `hostname` drops the prefix entirely — catalog-api, identity-api, gateway —
#    because that is what the other containers resolve through Docker DNS, and it
#    only has to be unique inside this network.
#
#  The compose PROJECT name (top-level `name:`) is what Docker Desktop groups
#  containers under. Keep it short and stable: it is the label every container
#  carries in the UI, and renaming it orphans the containers created under the old one.
#
#  All business processes connect to the platform containers by their container names,
#  which resolve on the shared nur-tricenter-net network. Each microservice owns ONE
#  database inside that Postgres, created by the init.sql in postgres-init/.
# =============================================================================

include:
  - path: docker-compose.infra.yml

  # The catalog's two business processes, attached to the SHARED platform network
  # and infrastructure. NOT the catalog repository's own docker-compose.yml, which is
  # a standalone stack with its own Postgres and network.
  - path: ../../ms2-plans-and-recipes-catalog/catalog.compose.yml

  # Identity's two business processes, same arrangement. NOT the identity
  # repository's own docker-compose.yml, which is standalone.
  - path: ../../nur-tricenter-identity/identity.compose.yml

  # MS4 (delivery calendar): API + migrate job + RabbitMQ worker, same arrangement. Repository
  # ms4-delivery-schedule-management, cloned as a sibling like the two above.
  - path: ../../ms4-delivery-schedule-management/ms4.compose.yml

  # ms5 (logistics and delivery): API + outbox worker, same arrangement. Cloned by
  # setup-project as ms5-logistics-and-delivery (the Nur-tricenter repository); a checkout
  # under another folder name sets NURTRICENTER_REPO_DIR instead.
  - path: ../../${NURTRICENTER_REPO_DIR:-ms5-logistics-and-delivery}/nurtricenter.compose.yml

  # MS3 (contracting and production): API + outbox/consumer worker, same arrangement. Repository
  # ms3-contract-and-production, cloned as a sibling like the others.
  - path: ../../ms3-contract-and-production/contracting.compose.yml

services:
  gateway:
    # The runtime tag follows THIS project's TargetFramework (net10.0): the gateway
    # does not consume the shared kernels, so it was never part of the move to net8.0.
    # An aspnet:8.0 image running a net10.0 assembly starts and dies on a missing framework.
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nur-tricenter-gateway
    hostname: gateway
    working_dir: /app
    command: ["dotnet", "ApiGateway.App.dll"]
    volumes:
      - ../../nur-tricenter-api-gateway/ApiGateway.App/bin/Debug/net10.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
    ports:
      - "15005:8080"
    networks: [nur-tricenter-net]
    depends_on:
      consul:
        condition: service_started
    healthcheck:
      # Shell TCP probe for the same reason as the catalog API: no curl in the runtime image.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  nur-tricenter-net:
    external: true
