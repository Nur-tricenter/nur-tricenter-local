# =============================================================================
#  RabbitMQ broker configuration for the Nur-Tricenter platform.
#
#  Declared in this single file rather than scattered across the compose
#  service env list so the topology-import decision is one read away from the
#  definitions file it depends on.
#
#  definitions.import_backend = local_filesystem is the documented boot-time
#  import mechanism for RabbitMQ 3.13+ (replaces RABBITMQ_LOAD_DEFINITIONS,
#  removed before 3.7). The broker reads the JSON pointed at by
#  definitions.local.path ON BOOT only.
#
#  definitions.skip_if_unchanged = true means the broker hashes the file and
#  re-imports only when its content actually changes. Without it every broker
#  restart re-applies the full file, which is harmless for our size but adds
#  boot latency and pollutes boot logs.
#
#  The imported file declares the 5 fanout exchanges of the catalog
#  microservice (matching the Joseco.Communication.External.RabbitMQ 1.1.0
#  publisher flags) and the 20 consumer queues (5 exchanges x ms1/ms3/ms4/ms5).
#  The flag combinations in the JSON MUST match what the catalog worker
#  publishes against (fanout, durable=false): RabbitMQ rejects a
#  redeclaration with different arguments as
#  406 PRECONDITION_FAILED, which would break every publish.
# =============================================================================

definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

# "guest" debe poder conectarse desde la red compose (172.18.0.x), no solo
# desde el loopback del broker. Por seguridad, conviene migrar a usuarios
# dedicados por microservicio en lugar de "guest". loopback_users = none
# es la opción documentada para desactivar el bloqueo por defecto de las
# conexiones remotas al usuario guest.
loopback_users = none
