name: ms2-plans-and-recipes-catalog

# =============================================================================
#  Infrastructure for the Nur-Tricenter stack.
#
#  Started by start-infrastructure.ps1/.sh BEFORE the Aspire AppHost runs.
#  Aspire does not manage any of this: it treats Postgres, RabbitMQ and
#  Consul as external services referenced by connection string / host name.
#
#  Container names match the ones the catalog and gateway compose files
#  already use, so the same containers can be reused whether the stack is
#  brought up by this compose or by Aspire.
#
#  Healthchecks are mandatory: the start-infrastructure scripts wait for
#  all three to be healthy before exiting, so by the time AppHost runs the
#  three projects can connect on the first try.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ms2-plans-and-recipes-catalog-postgres
    hostname: ms2-plans-and-recipes-catalog-postgres
    environment:
      # One database per microservice, named after the microservice. The
      # guide does this for every service (StoreIdentity, StoreCatalog,
      # StoreInventory, StoreOrders, StorePayments); we follow the same rule.
      POSTGRES_DB: ms2-plans-and-recipes-catalog
      POSTGRES_USER: dev-only
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-only -d ms2-plans-and-recipes-catalog"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [ms2-plans-and-recipes-catalog-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ms2-plans-and-recipes-catalog-rabbitmq
    hostname: ms2-plans-and-recipes-catalog-rabbitmq
    # Seed credentials: the catalog and gateway use catalogUser / catalogUserPassword
    # to publish, and the broker integration tests in the catalog use the same
    # pair. RABBITMQ_DEFAULT_* is consumed by the image on first boot and stored
    # in the volume; if the volume predates the seeding, delete the volume and
    # let start-stack recreate it.
    environment:
      RABBITMQ_DEFAULT_USER: catalogUser
      RABBITMQ_DEFAULT_PASS: catalogUserPassword
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: [ms2-plans-and-recipes-catalog-net]
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.20
    container_name: ms2-plans-and-recipes-catalog-consul
    hostname: ms2-plans-and-recipes-catalog-consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui", "-log-level=warn"]
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [ms2-plans-and-recipes-catalog-net]
    restart: unless-stopped

networks:
  ms2-plans-and-recipes-catalog-net:
    # The network is created by whichever compose file is started first
    # (the catalog's own compose, this one, or `docker network create`).
    # Aspire does not need to own it.
    name: ms2-plans-and-recipes-catalog-net
    external: true

volumes:
  postgres-data:
    # Created by this compose the first time `up` runs. Kept across
    # `down` invocations so the catalog's seed data survives a stop/start
    # cycle of the orchestrator. To wipe it, run
    # `stop-infrastructure.ps1 -v` / `stop-infrastructure.sh -v`.
    name: ms2-plans-and-recipes-catalog-postgres-data
