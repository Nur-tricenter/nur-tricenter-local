name: nur-tricenter-infra

# =============================================================================
#  Nur-Tricenter platform: shared infra + the microservice processes that
#  run on it.
#
#  Includes docker-compose.infra.yml (Postgres + RabbitMQ + Consul) plus
#  the three business processes of the catalog microservice:
#
#    catalog-api          Catalog.WebApi        net10.0  (microservice: catalog)
#    catalog-workerservice Catalog.WorkerService net10.0 (microservice: catalog)
#    apigateway-webapp    ApiGateway.WebApp     net10.0  (platform, fronts catalog)
#
#  Naming convention
#  -----------------
#    - Platform containers (Postgres, RabbitMQ, Consul) keep the
#      nur-tricenter- prefix. They are shared by every microservice.
#    - The gateway is a platform component, named after the platform
#      (nur-tricenter-apigateway-webapp) even though, in this layout, it
#      fronts this microservice. Its bind-mount points at the actual
#      gateway repo (../nur-tricenter-api-gateway/).
#    - Microservice processes (catalog-api, catalog-workerservice) get
#      the nur-tricenter-ms2-plans-and-recipes-catalog- prefix because
#      they belong to this microservice.
#
#  All three business processes connect to the platform containers by
#  their container names, which resolve on the shared nur-tricenter-net
#  network. The database inside Postgres is ms2-plans-and-recipes-catalog
#  (one database per microservice, named after the microservice, created
#  by the init.sql in postgres-init/).
# =============================================================================

include:
  - path: docker-compose.infra.yml

services:
  catalog-api:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nur-tricenter-ms2-plans-and-recipes-catalog-api
    hostname: catalog-api
    working_dir: /app
    command: ["dotnet", "Catalog.WebApi.dll"]
    volumes:
      - ../ms2-plans-and-recipes-catalog/src/Catalog.WebApi/bin/Debug/net10.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Connect to the platform Postgres, but the catalog's own database,
      # not the default `postgres` one. Created by the init.sql that
      # mounts at /docker-entrypoint-initdb.d inside the postgres container.
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "catalogUser"
      RabbitMqSettings__Password: "catalogUserPassword"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
      # Pin the host and port the catalog advertises to Consul. Without
      # these the catalog's IServerPortResolver picks whatever Kestrel
      # bound to, which during hosted-service startup is usually a dynamic
      # port and makes the registration inconsistent with the gateway's
      # expectations.
      ServiceRegistration__Host: "catalog-api"
      ServiceRegistration__Port: "8080"
      ServiceRegistration__ServiceName: "catalog"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  catalog-workerservice:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nur-tricenter-ms2-plans-and-recipes-catalog-workerservice
    hostname: catalog-workerservice
    working_dir: /app
    command: ["dotnet", "Catalog.WorkerService.dll"]
    volumes:
      - ../ms2-plans-and-recipes-catalog/src/Catalog.WorkerService/bin/Debug/net10.0:/app:ro
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "catalogUser"
      RabbitMqSettings__Password: "catalogUserPassword"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  apigateway-webapp:
    # The gateway is its own platform component, named after the platform
    # (nur-tricenter), not after this microservice. It fronts the catalog
    # today and will front other microservices as they come online.
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nur-tricenter-apigateway-webapp
    hostname: apigateway-webapp
    working_dir: /app
    command: ["dotnet", "ApiGateway.WebApp.dll"]
    volumes:
      - ../nur-tricenter-api-gateway/ApiGateway.WebApp/bin/Debug/net10.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
    ports:
      - "15005:8080"
    networks: [nur-tricenter-net]
    depends_on:
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  nur-tricenter-net:
    external: true
