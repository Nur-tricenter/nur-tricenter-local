# The compose project name. Docker Desktop groups every container under this label, and it
# is the first thing visible in the UI — so it names the platform, not a single component.
name: nur-tricenter

# =============================================================================
#  Nur-Tricenter platform: shared infra + the microservice processes that
#  run on it.
#
#  Includes docker-compose.infra.yml (Postgres + RabbitMQ + Consul) plus
#  the three business processes of the catalog microservice:
#
#    catalog-api          Catalog.WebApi        net10.0  (microservice: catalog)
#    catalog-workerservice Catalog.WorkerService net10.0 (microservice: catalog)
#    apigateway-webapp    ApiGateway.App     net10.0  (platform, fronts catalog)
#
#  Naming convention
#  -----------------
#    Every container is nur-tricenter-<what-it-is>: the prefix says the
#    platform, the suffix says the role. Nothing repeats the repository
#    name, because a container outlives the repository it was built
#    from and a 60-character name costs more than it explains.
#
#      nur-tricenter-postgres           platform, shared
#      nur-tricenter-rabbitmq           platform, shared
#      nur-tricenter-consul             platform, shared
#      nur-tricenter-catalog-api        one microservice, its HTTP entry
#      nur-tricenter-catalog-workerservice   the same microservice, its worker
#      nur-tricenter-gateway            platform, the single public entry point
#
#    The compose SERVICE name and the container name are the same word.
#    They used to differ (apigateway-webapp vs the container), and that is
#    what makes `docker compose ps` disagree with `docker ps` and forces a
#    lookup to work out which is which. One name, both places.
#
#    `hostname` drops the prefix entirely — catalog-api, catalog-workerservice,
#    gateway — because that is what the other containers resolve through
#    Docker DNS, and it only has to be unique inside this network.
#
#  The compose PROJECT name (top-level `name:`) is what Docker Desktop
#  groups containers under. Keep it short and stable: it is the label every
#  container carries in the UI, and renaming it orphans the containers that
#  were created under the old one.
#
#  All three business processes connect to the platform containers by
#  their container names, which resolve on the shared nur-tricenter-net
#  network. The database inside Postgres is ms2-plans-and-recipes-catalog
#  (one database per microservice, named after the microservice, created
#  by the init.sql in postgres-init/).
# =============================================================================

include:
  - path: docker-compose.infra.yml

services:
  catalog-api:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: nur-tricenter-catalog-api
    hostname: catalog-api
    working_dir: /app
    command: ["dotnet", "Catalog.App.dll"]
    volumes:
      - ../ms2-plans-and-recipes-catalog/src/Catalog.App/bin/Debug/net8.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Swagger stays off, as it is everywhere else: the gateway has no documentation UI, so
      # nothing in the stack consumes this document. Each service exposes its own contract when
      # Swagger__Enabled is turned on deliberately.
      # Connect to the platform Postgres, but the catalog's own database,
      # not the default `postgres` one. Created by the init.sql that
      # mounts at /docker-entrypoint-initdb.d inside the postgres container.
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
      # Seed the sample catalogue (30 foods / 25 recipes / 2 plans) on startup so the seed
      # events land in the transactional outbox, are drained by the catalog worker, and reach
      # the broker's fanout exchanges (meal-plan-published, food-published, recipe-published,
      # recipe-updated, food-nutritional-info-updated). The topology that fans those out to
      # ms1/ms3/ms4/ms5 is declared by rabbitmq-definitions.json at broker boot.
      Seed__Enabled: "true"
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
      # Pin the host and port the catalog advertises to Consul. Without
      # these the catalog's IServerPortResolver picks whatever Kestrel
      # bound to, which during hosted-service startup is usually a dynamic
      # port and makes the registration inconsistent with the gateway's
      # expectations.
      ServiceRegistration__Host: "catalog-api"
      ServiceRegistration__Port: "8080"
      ServiceRegistration__ServiceName: "catalog"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started
    healthcheck:
      # A shell TCP probe, not curl. The aspnet runtime image ships no curl, so a healthcheck that
      # calls it fails with "curl: not found" forever and the container is reported unhealthy
      # while the application is perfectly fine. /dev/tcp is part of bash, which is present.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  catalog-workerservice:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: nur-tricenter-catalog-workerservice
    hostname: catalog-workerservice
    working_dir: /app
    command: ["dotnet", "Catalog.WorkerService.dll"]
    volumes:
      - ../ms2-plans-and-recipes-catalog/src/Catalog.WorkerService/bin/Debug/net8.0:/app:ro
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__CatalogDbConnectionString: "Host=nur-tricenter-postgres;Port=5432;Database=ms2-plans-and-recipes-catalog;Username=dev-only;Password=dev-only-password"
      RabbitMqSettings__Host: "nur-tricenter-rabbitmq"
      RabbitMqSettings__UserName: "guest"
      RabbitMqSettings__Password: "guest"
      RabbitMqSettings__VirtualHost: "/"
      RabbitMqSettings__MaxRetryAttempts: "3"
      RabbitMqSettings__RetryBaseDelayMilliseconds: "500"
    networks: [nur-tricenter-net]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        # service_healthy, not service_started: the outbox processor connects to the broker as
        # soon as it starts, and a broker that is still booting turns the first publish attempt
        # into an exception on every poll until it settles.
        condition: service_healthy
    # This process is NOT registered in Consul, and that is deliberate.
    #
    # Consul registration exists so the gateway can route traffic to a service. The worker
    # publishes to RabbitMQ and serves no HTTP at all: it has no listener, no controller and no
    # address to register. Registering it would publish a route to an endpoint that cannot
    # answer, and the gateway would happily proxy into a black hole.
    #
    # Its liveness is a container concern, not a routing concern, so it belongs in a Docker
    # healthcheck. The process is a long-running OutboxProcessor: if it exits, the outbox stops
    # being drained and no event is ever projected. That is exactly what a restart policy is for,
    # and it is what this check reports.
    healthcheck:
      # `/proc/<pid>/cmdline` rather than `pgrep`: the aspnet runtime image ships no procps, so
      # `pgrep: not found` fails the check forever while the worker is running perfectly. Reading
      # the kernel's own view of the process needs no extra tool. There is no port to probe
      # either — this host has no listener.
      test: ["CMD-SHELL", "grep -qs 'Catalog.WorkerService' /proc/*/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  gateway:
    # The runtime tag follows THIS project's TargetFramework (net10.0): the gateway
    # does not consume the shared kernels, so it was never part of the move to net8.0.
    # An aspnet:8.0 image running a net10.0 assembly starts and dies on a missing framework.
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: nur-tricenter-gateway
    hostname: gateway
    working_dir: /app
    command: ["dotnet", "ApiGateway.App.dll"]
    volumes:
      - ../nur-tricenter-api-gateway/ApiGateway.App/bin/Debug/net10.0:/app:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ServiceRegistration__ServiceDiscoveryAddress: "http://nur-tricenter-consul:8500"
    ports:
      - "15005:8080"
    networks: [nur-tricenter-net]
    depends_on:
      consul:
        condition: service_started
    healthcheck:
      # Shell TCP probe for the same reason as the catalog API: no curl in the runtime image.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  nur-tricenter-net:
    external: true
